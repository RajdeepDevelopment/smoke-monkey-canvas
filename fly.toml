# 🐒 Smoke Monkey Canvas — Fly.io Configuration
app = "smoke-monkey-canvas"
primary_region = "iad"

[build]
  image = "rajdeepsadhu/smoke-monkey-canvas:latest"

[http_service]
  internal_port = 3333
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

[[http_service.checks]]
  grace_period = "15s"
  interval = "15s"
  method = "GET"
  timeout = "5s"
  path = "/api/health"

[env]
  NODE_ENV = "production"
  HOST = "0.0.0.0"
  SMOKE_CANVAS_DB = "/app/data/canvas.db"

# The web UI authenticates with a bearer token that the server never sends to
# remote browsers. Set it as a secret, then open the app once as
#   https://<app>.fly.dev/#token=<value>
#   fly secrets set SMOKE_MONKEY_AUTH_TOKEN=$(openssl rand -hex 32)
# See SECURITY.md.

[mounts]
  source = "canvas_data"
  destination = "/app/data"
