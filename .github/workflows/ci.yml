name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    name: Build & Verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Root Dependencies
        run: npm ci || npm install

      - name: Install Web Dependencies
        run: npm --prefix web install

      - name: Build Web Application
        run: npm run build

      - name: Check TypeScript Types
        run: npx tsc --noEmit

      - name: Lint Web Application
        # oxlint exits non-zero only on error-severity findings (warnings,
        # e.g. exhaustive-deps, don't fail the build). react-hooks(rules-of-hooks)
        # is error-severity by default — see #7, where this was missing and a
        # hooks-order regression shipped undetected.
        run: npm --prefix web run lint

      - name: Verify CLI Executable
        run: node ./bin/cli.js --help
