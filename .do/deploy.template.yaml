spec:
  name: smoke-monkey-canvas
  region: nyc
  services:
    - name: web
      image:
        registry_type: DOCKER_HUB
        registry: rajdeepsadhu
        repository: smoke-monkey-canvas
        tag: latest
      instance_size_slug: apps-s-1vcpu-1gb
      instance_count: 1
      http_port: 3333
      routes:
        - path: /
      health_check:
        http_path: /api/health
        initial_delay_seconds: 15
        period_seconds: 10
        timeout_seconds: 5
        success_threshold: 1
        failure_threshold: 3
      envs:
        - key: NODE_ENV
          value: production
        - key: HOST
          value: "0.0.0.0"
        - key: SMOKE_CANVAS_DB
          value: /app/data/canvas.db
        # The web UI authenticates with a bearer token that the server never
        # sends to remote browsers. Add SMOKE_MONKEY_AUTH_TOKEN as a SECRET env
        # var with a long random value, then open the app once as
        # https://<app>.ondigitalocean.app/?token=<value>. See SECURITY.md.
